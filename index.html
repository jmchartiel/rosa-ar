<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Rosa Ramalho — Peixe em Realidade Aumentada</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;}
  #hint{
    position:fixed;left:0;right:0;bottom:0;z-index:9999;
    background:linear-gradient(0deg, rgba(42,33,27,.82), rgba(42,33,27,0));
    color:#fff;text-align:center;padding:26px 18px 18px;font-size:14px;line-height:1.5;pointer-events:none;
  }
  #hint b{color:#E0A02E;}
  #badge{
    position:fixed;top:14px;left:14px;z-index:9999;
    background:rgba(251,244,231,.92);color:#2A211B;border-radius:999px;
    padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:.04em;
  }
</style>
</head>
<body>
  <div id="badge">Rosa Ramalho · AR</div>
  <div id="hint">Aponte a câmara ao <b>marcador impresso</b> para o peixe aparecer.</div>

  <a-scene
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true"
      embedded
      arjs="sourceType: webcam; detectionMode: mono; patternRatio: 0.5; debugUIEnabled: false;">

    <a-entity light="type: ambient; intensity: 1.1; color: #fff4e0"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 4 3"></a-entity>

    <a-marker type="pattern" url="rosa-fish.patt" smooth="true" smoothCount="6" smoothTolerance="0.02" smoothThreshold="3">
      <a-entity
          gltf-model="url(fish.glb)"
          animation-mixer="clip: swim; loop: repeat"
          position="0 0.6 0"
          rotation="0 0 0"
          scale="0.7 0.7 0.7">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
